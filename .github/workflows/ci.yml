name: CI

# PILOT — references the org reusables on the PR branch until agiletec-inc/.github#10 merges.
# After that merges, flip @ci/org-wide-reusable-quality-gates -> @main (or a pinned tag).
# Required checks: "secret-scan / scan" and "ci / ci".
on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    uses: agiletec-inc/.github/.github/workflows/secret-scan.yml@ci/org-wide-reusable-quality-gates
  ci:
    uses: agiletec-inc/.github/.github/workflows/node-pnpm-ci.yml@ci/org-wide-reusable-quality-gates
    with:
      node-version: '20'
      run-command: npm run lint && npm run typecheck && npm test
