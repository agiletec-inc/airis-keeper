name: CI

# Org reusable CI caller — logic lives in agiletec-inc/.github reusables.
# Required checks: "secret-scan / scan" and "ci / ci".
on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    uses: agiletec-inc/.github/.github/workflows/secret-scan.yml@main
  ci:
    uses: agiletec-inc/.github/.github/workflows/node-pnpm-ci.yml@main
    with:
      node-version: '20'
      run-command: npm run lint && npm run typecheck && npm test
